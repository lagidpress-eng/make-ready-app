<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Make Ready Agent</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">
  <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6 mt-4">
    <h1 class="text-2xl font-bold mb-6 text-center text-gray-800">Make Ready: Опора</h1>
    <form id="workForm" class="space-y-4">
      <div>
        <label class="block text-sm font-bold text-gray-700">Номер опоры (Pole #)</label>
        <input type="text" id="pole" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-3 border text-lg">
      </div>
      <div>
        <label class="block text-sm font-bold text-gray-700">Map (GPS)</label>
        <input type="text" id="map" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-3 border text-lg" placeholder="Например: 38.972, -121.605">
      </div>
      <div>
        <label class="block text-sm font-bold text-gray-700">P.T. #</label>
        <input type="text" id="pt" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-3 border text-lg">
      </div>
      <div>
        <label class="block text-sm font-bold text-gray-700">Статус работы</label>
        <select id="status" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-3 border text-lg bg-white">
          <option value="Done">Выполнено (Done)</option>
          <option value="Pending">В ожидании (Pending)</option>
        </select>
      </div>
      <div class="pt-2">
        <label class="block text-sm font-bold text-gray-700 mb-2">Фотография (Камера)</label>
        <!-- Атрибут capture="environment" сразу откроет камеру на телефоне -->
        <input type="file" id="photo" accept="image/*" capture="environment" class="block w-full text-sm text-gray-500
          file:mr-4 file:py-3 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-bold file:bg-blue-100 file:text-blue-700 hover:file:bg-blue-200">
      </div>
      <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white font-bold py-4 px-4 rounded-md hover:bg-blue-700 mt-6 shadow-lg text-lg transition duration-200">
        ОТПРАВИТЬ ОТЧЕТ
      </button>
    </form>
    <div id="message" class="mt-6 text-center text-lg font-bold hidden"></div>
  </div>

  <script>
    document.getElementById('workForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const msg = document.getElementById('message');
      btn.disabled = true;
      btn.innerText = 'Отправка данных...';
      btn.classList.replace('bg-blue-600', 'bg-gray-400');
      msg.classList.add('hidden');

      const pole = document.getElementById('pole').value;
      const map = document.getElementById('map').value;
      const pt = document.getElementById('pt').value;
      const status = document.getElementById('status').value;
      const photoInput = document.getElementById('photo');
      
      let imageBase64 = null;
      let mimeType = null;

      // Если выбрали фото, конвертируем его
      if (photoInput.files.length > 0) {
        const file = photoInput.files[0];
        mimeType = file.type;
        const reader = new FileReader();
        const filePromise = new Promise((resolve) => {
          reader.onload = (event) => resolve(event.target.result);
          reader.readAsDataURL(file);
        });
        imageBase64 = await filePromise;
      }

      try {
        const response = await fetch('/api/upload', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pole, map, pt, status, imageBase64, mimeType })
        });
        
        const result = await response.json();
        
        if (response.ok) {
          msg.innerText = '✅ Отчет успешно отправлен!';
          msg.className = 'mt-6 text-center text-lg font-bold text-green-600 block';
          document.getElementById('workForm').reset();
        } else {
          msg.innerText = '❌ Ошибка: ' + result.error;
          msg.className = 'mt-6 text-center text-lg font-bold text-red-600 block';
        }
      } catch (err) {
        msg.innerText = '❌ Ошибка соединения (проверьте интернет)';
        msg.className = 'mt-6 text-center text-lg font-bold text-red-600 block';
      }

      btn.disabled = false;
      btn.innerText = 'ОТПРАВИТЬ ОТЧЕТ';
      btn.classList.replace('bg-gray-400', 'bg-blue-600');
    });
  </script>
</body>
</html>
